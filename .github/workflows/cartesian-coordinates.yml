name: Cartesian coordinate math

on:
  pull_request:
    paths:
      - 'thinkbook-deploy/payload/source/EtherCATDemo/CartesianCoordinates.cs'
      - 'thinkbook-deploy/payload/source/EtherCATDemo/tests/CartesianCoordinatesTests.cs'
      - 'thinkbook-deploy/payload/source/EtherCATDemo/CSharpDemo.csproj'
      - 'thinkbook-deploy/scripts/build-dashboard.ps1'
      - 'tests/cartesian-portable/**'
      - '.github/workflows/cartesian-coordinates.yml'
  push:
    branches: [main]
    paths:
      - 'thinkbook-deploy/payload/source/EtherCATDemo/CartesianCoordinates.cs'
      - 'thinkbook-deploy/payload/source/EtherCATDemo/tests/CartesianCoordinatesTests.cs'
      - 'thinkbook-deploy/payload/source/EtherCATDemo/CSharpDemo.csproj'
      - 'thinkbook-deploy/scripts/build-dashboard.ps1'
      - 'tests/cartesian-portable/**'
      - '.github/workflows/cartesian-coordinates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-math:
    name: Windows .NET Framework coordinate tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile C# 4 and run pure math checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path -LiteralPath $csc)) { throw '.NET Framework C# compiler missing.' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'thinkbook-deploy\payload\source\EtherCATDemo'
          $exe = Join-Path $env:RUNNER_TEMP 'CartesianCoordinatesTests.exe'
          & $csc /nologo /langversion:4 /warnaserror+ /platform:x64 /target:exe "/out:$exe" (Join-Path $source 'CartesianCoordinates.cs') (Join-Path $source 'tests\CartesianCoordinatesTests.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Coordinate test compilation failed.' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Coordinate tests failed.' }
          # Only a console math test is run. No operator app, vendor SDK, or hardware.
